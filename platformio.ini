; proto_esp32_s3 — breadboard prototype firmware
; ESP32-S3_Libraries comes from GitHub. LibDriver ST7789 is vendored under lib/st7789.

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 7.0.1
board = esp32-s3-devkitc-1
framework = espidf

board_build.flash_size = 8MB

monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; This platform reads sdkconfig.defaults (Wi-Fi on, Bluetooth off, 8 MB).
extra_scripts = pre:tool/skip_idle_ble.py
lib_ldf_mode = deep+
lib_ignore = ST7789

lib_deps =
    https://github.com/Matto-kun/ESP32-S3_Libraries.git#feat-imu-gnss-appble

; Default BLE bring-up role is peripheral. For central:
;   pio run -e esp32-s3-devkitc-1-ble-central -t upload
build_flags =
    -DBLE_TEST_ROLE_CENTRAL=0

[env:esp32-s3-devkitc-1-ble-central]
extends = env:esp32-s3-devkitc-1
build_flags =
    -DBLE_TEST_ROLE_CENTRAL=1

; Mag (HMC5983) + IR (AMG8833) on I2C1 SDA=39 SCL=38 — serial only.
;   SENSOR_BRINGUP=1 pio run -e esp32-s3-devkitc-1-sensor-bringup -t upload
[env:esp32-s3-devkitc-1-sensor-bringup]
extends = env:esp32-s3-devkitc-1
build_flags =
    -DSENSOR_BRINGUP=1
